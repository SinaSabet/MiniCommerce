services:


  ordering-db:

    image: mcr.microsoft.com/mssql/server:2022-latest

    container_name: ordering-sqlserver

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "1234567890"

    ports:
      - "14331:1433"

    volumes:
      - ordering-db-data:/var/opt/mssql

    networks:
      - minicomm-network



  inventory-db:

    image: mcr.microsoft.com/mssql/server:2022-latest

    container_name: inventory-sqlserver

    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "1234567890"

    ports:
      - "14332:1433"

    volumes:
      - inventory-db-data:/var/opt/mssql

    networks:
      - minicomm-network



  rabbitmq:

    image: rabbitmq:3-management

    container_name: minicomm-rabbitmq

    ports:
      - "5672:5672"
      - "15672:15672"

    networks:
      - minicomm-network



  redis:

    image: redis:7

    container_name: minicomm-redis

    ports:
      - "6379:6379"

    networks:
      - minicomm-network



  ordering-api:

    image: minicommerce-ordering

    container_name: ordering-api

    ports:
      - "8080:8080"

    environment:

      ASPNETCORE_ENVIRONMENT: Development


      ConnectionStrings__OrderingConnection:
        Server=ordering-db;
        Database=MiniCommerce.Ordering;
        User Id=sa;
        Password=YourStrong@Passw0rd;
        TrustServerCertificate=True


      RabbitMQ__Host: rabbitmq
      RabbitMQ__VirtualHost: /
      RabbitMQ__Username: guest
      RabbitMQ__Password: guest


    depends_on:
      - ordering-db
      - rabbitmq


    networks:
      - minicomm-network




  inventory-api:

    image: minicommerce-inventory

    container_name: inventory-api


    ports:
      - "8081:8080"


    environment:


      ASPNETCORE_ENVIRONMENT: Development


      ConnectionStrings__InventoryConnection:
        Server=inventory-db;
        Database=MiniCommerce.Inventory;
        User Id=sa;
        Password=YourStrong@Passw0rd;
        TrustServerCertificate=True


      RabbitMQ__Host: rabbitmq
      RabbitMQ__VirtualHost: /
      RabbitMQ__Username: guest
      RabbitMQ__Password: guest


    depends_on:

      - inventory-db
      - rabbitmq


    networks:
      - minicomm-network



volumes:

  ordering-db-data:

  inventory-db-data:



networks:

  minicomm-network: