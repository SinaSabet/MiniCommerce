services:


  nginx:

    image: nginx:latest

    container_name: minicomm-nginx

    restart: unless-stopped


    ports:

      - "80:80"


    volumes:

      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro


    depends_on:

      - ordering-api
      - inventory-api


    networks:

      - minicomm-network
  ordering-db:

    image: mcr.microsoft.com/mssql/server:2022-latest

    container_name: ordering-sqlserver

    restart: unless-stopped

    environment:

      ACCEPT_EULA: "Y"

      MSSQL_SA_PASSWORD: ${MSSQL_PASSWORD}


    ports:

      - "14331:1433"


    volumes:

      - ordering-db-data:/var/opt/mssql


    healthcheck:

      test:
        [
          "CMD-SHELL",
          "timeout 5 bash -c '</dev/tcp/127.0.0.1/1433'"
        ]

      interval: 10s

      timeout: 5s

      retries: 20


    networks:

      - minicomm-network


  ordering-db-init:

    image: mcr.microsoft.com/mssql-tools:latest

    container_name: ordering-db-init

    environment:
      ACCEPT_EULA: "Y"

    command:
      - /opt/mssql-tools/bin/sqlcmd
      - -S
      - ordering-db,1433
      - -U
      - sa
      - -P
      - ${MSSQL_PASSWORD}
      - -C
      - -b
      - -i
      - /scripts/ordering.sql
      - -i
      - /scripts/ordersaga.sql

    volumes:
      - ./Infrastructure/Database/init/ordering:/scripts:ro

    depends_on:
      ordering-db:
        condition: service_healthy

    networks:
      - minicomm-network





  inventory-db:

    image: mcr.microsoft.com/mssql/server:2022-latest

    container_name: inventory-sqlserver

    restart: unless-stopped


    environment:

      ACCEPT_EULA: "Y"

      MSSQL_SA_PASSWORD: ${MSSQL_PASSWORD}


    ports:

      - "14332:1433"


    volumes:

      - inventory-db-data:/var/opt/mssql


    healthcheck:

      test:
        [
          "CMD-SHELL",
          "timeout 5 bash -c '</dev/tcp/127.0.0.1/1433'"
        ]

      interval: 10s

      timeout: 5s

      retries: 20


    networks:

      - minicomm-network


  inventory-db-init:

    image: mcr.microsoft.com/mssql-tools:latest

    container_name: inventory-db-init

    environment:
      ACCEPT_EULA: "Y"

    command:
      - /opt/mssql-tools/bin/sqlcmd
      - -S
      - inventory-db,1433
      - -U
      - sa
      - -P
      - ${MSSQL_PASSWORD}
      - -C
      - -b
      - -i
      - /scripts/inventory.sql

    volumes:
      - ./Infrastructure/Database/init/inventory:/scripts:ro

    depends_on:
      inventory-db:
        condition: service_healthy

    networks:
      - minicomm-network





  shipping-db:

    image: mcr.microsoft.com/mssql/server:2022-latest

    container_name: shipping-sqlserver

    restart: unless-stopped


    environment:

      ACCEPT_EULA: "Y"

      MSSQL_SA_PASSWORD: ${MSSQL_PASSWORD}


    ports:

      - "14334:1433"


    volumes:

      - shipping-db-data:/var/opt/mssql


    healthcheck:

      test:
        [
          "CMD-SHELL",
          "timeout 5 bash -c '</dev/tcp/127.0.0.1/1433'"
        ]

      interval: 10s

      timeout: 5s

      retries: 20


    networks:

      - minicomm-network


  shipping-db-init:

    image: mcr.microsoft.com/mssql-tools:latest

    container_name: shipping-db-init

    environment:
      ACCEPT_EULA: "Y"

    command:
      - /opt/mssql-tools/bin/sqlcmd
      - -S
      - shipping-db,1433
      - -U
      - sa
      - -P
      - ${MSSQL_PASSWORD}
      - -C
      - -b
      - -i
      - /scripts/shipping.sql

    volumes:
      - ./Infrastructure/Database/init/shipping:/scripts:ro

    depends_on:
      shipping-db:
        condition: service_healthy

    networks:
      - minicomm-network




  payment-db:

    image: mcr.microsoft.com/mssql/server:2022-latest

    container_name: payment-sqlserver

    restart: unless-stopped


    environment:

      ACCEPT_EULA: "Y"

      MSSQL_SA_PASSWORD: ${MSSQL_PASSWORD}


    ports:

      - "14333:1433"


    volumes:

      - payment-db-data:/var/opt/mssql


    healthcheck:

      test:
        [
          "CMD-SHELL",
          "timeout 5 bash -c '</dev/tcp/127.0.0.1/1433'"
        ]

      interval: 10s

      timeout: 5s

      retries: 20


    networks:

      - minicomm-network


  payment-db-init:

    image: mcr.microsoft.com/mssql-tools:latest

    container_name: payment-db-init

    environment:
      ACCEPT_EULA: "Y"

    command:
      - /opt/mssql-tools/bin/sqlcmd
      - -S
      - payment-db,1433
      - -U
      - sa
      - -P
      - ${MSSQL_PASSWORD}
      - -C
      - -b
      - -i
      - /scripts/payment.sql

    volumes:
      - ./Infrastructure/Database/init/payment:/scripts:ro

    depends_on:
      payment-db:
        condition: service_healthy

    networks:
      - minicomm-network





  rabbitmq:

    image: rabbitmq:3-management
    container_name: minicomm-rabbitmq

    restart: unless-stopped


    environment:

      RABBITMQ_DEFAULT_USER: ${RABBIT_USERNAME}

      RABBITMQ_DEFAULT_PASS: ${RABBIT_PASSWORD}


    ports:

      - "5672:5672"

      - "15672:15672"


    healthcheck:

      test:
        [
          "CMD",
          "rabbitmq-diagnostics",
          "ping"
        ]

      interval: 10s

      timeout: 5s

      retries: 10


    networks:

      - minicomm-network





  redis:

    image: redis:7

    container_name: minicomm-redis

    restart: unless-stopped


    ports:

      - "6379:6379"


    networks:

      - minicomm-network





  ordering-api:

    build:

      context: .

      dockerfile: Ordering.API/Dockerfile

    image: minicommerce-ordering

    container_name: ordering-api

    restart: unless-stopped


    ports:

      - "8080:8080"


    environment:

      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}

      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317


      ConnectionStrings__OrderingConnection: "Server=ordering-db;Database=MiniCommerce.Ordering;User Id=sa;Password=${MSSQL_PASSWORD};TrustServerCertificate=True"


      RabbitMQ__Host: rabbitmq

      RabbitMQ__VirtualHost: /

      RabbitMQ__Username: ${RABBIT_USERNAME}

      RabbitMQ__Password: ${RABBIT_PASSWORD}


    depends_on:

      ordering-db-init:

        condition: service_completed_successfully


      rabbitmq:

        condition: service_healthy


    networks:

      - minicomm-network





  inventory-api:

    build:

      context: .

      dockerfile: Inventory.API/Dockerfile

    image: minicommerce-inventory

    container_name: inventory-api

    restart: unless-stopped


    ports:

      - "8081:8080"


    environment:

      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}

      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317


      ConnectionStrings__InventoryConnection: "Server=inventory-db;Database=MiniCommerce.Inventory;User Id=sa;Password=${MSSQL_PASSWORD};TrustServerCertificate=True"


      RabbitMQ__Host: rabbitmq

      RabbitMQ__VirtualHost: /

      RabbitMQ__Username: ${RABBIT_USERNAME}

      RabbitMQ__Password: ${RABBIT_PASSWORD}


    depends_on:

      inventory-db-init:

        condition: service_completed_successfully


      rabbitmq:

        condition: service_healthy


    networks:

      - minicomm-network





  shipping-api:
    build:
      context: .
      dockerfile: Shipping.API/Dockerfile

    image: minicommerce-shipping

    container_name: minicomm-shipping-api

    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317

      ConnectionStrings__ShippingConnection: "Server=shipping-db;Database=MiniCommerce.Shipping;User Id=sa;Password=${MSSQL_PASSWORD};TrustServerCertificate=True"

      RabbitMQ__Host: rabbitmq
      RabbitMQ__VirtualHost: /
      RabbitMQ__Username: ${RABBIT_USERNAME}
      RabbitMQ__Password: ${RABBIT_PASSWORD}

    depends_on:
      shipping-db-init:
        condition: service_completed_successfully

      rabbitmq:
        condition: service_healthy

    networks:
      - minicomm-network




  payment-api:

    build:

      context: .

      dockerfile: Payment.API/Dockerfile

    image: minicommerce-payment

    container_name: payment-api

    restart: unless-stopped


    ports:

      - "8082:8080"


    environment:

      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT}

      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317


      ConnectionStrings__PaymentConnection: "Server=payment-db;Database=MiniCommerce.Payment;User Id=sa;Password=${MSSQL_PASSWORD};TrustServerCertificate=True"


      RabbitMQ__Host: rabbitmq

      RabbitMQ__VirtualHost: /

      RabbitMQ__Username: ${RABBIT_USERNAME}

      RabbitMQ__Password: ${RABBIT_PASSWORD}


    depends_on:

      payment-db-init:

        condition: service_completed_successfully


      rabbitmq:

        condition: service_healthy


    networks:

      - minicomm-network





  fault-monitoring-worker:

    build:

      context: .

      dockerfile: FaultMonitoring.Worker/Dockerfile

    image: minicommerce-fault-monitoring-worker

    container_name: minicomm-fault-monitoring-worker

    restart: unless-stopped


    environment:

      DOTNET_ENVIRONMENT: ${DOTNET_ENVIRONMENT:-Production}

      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317

      RabbitMQ__Host: rabbitmq

      RabbitMQ__VirtualHost: /

      RabbitMQ__Username: ${RABBIT_USERNAME}

      RabbitMQ__Password: ${RABBIT_PASSWORD}


    depends_on:

      rabbitmq:

        condition: service_healthy


    networks:

      - minicomm-network




  otel-collector:

    image: otel/opentelemetry-collector-contrib

    container_name: minicomm-otel-collector

    restart: unless-stopped


    command:

      - "--config=/etc/otelcol-contrib/config.yaml"


    volumes:

      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro


    ports:

      - "4317:4317"

      - "4318:4318"


    depends_on:

      - jaeger


    networks:

      - minicomm-network




  jaeger:

    image: jaegertracing/all-in-one

    container_name: minicomm-jaeger

    restart: unless-stopped


    environment:

      COLLECTOR_OTLP_ENABLED: "true"


    ports:

      - "16686:16686"


    networks:

      - minicomm-network





volumes:

  ordering-db-data:

  inventory-db-data:

  shipping-db-data:

  payment-db-data:





networks:

  minicomm-network:

    name: minicomm-network

    driver: bridge
