name: Docker Build and Push


on:
  workflow_run:
    workflows:
      - MiniCommerce CI
    types:
      - completed
    branches:
      - main


permissions:
  contents: read
  packages: write


jobs:

  docker-build:

    if: github.event.workflow_run.conclusion == 'success'

    runs-on: ubuntu-latest


    strategy:
      matrix:
        include:
          - service: Ordering.API
            image: ordering-api

          - service: Inventory.API
            image: inventory-api

          - service: Payment.API
            image: payment-api

          - service: Shipping.API
            image: shipping-api

          - service: FaultMonitoring.Worker
            image: fault-monitoring-worker

          - service: MiniCommerce.DatabaseMigrator
            image: database-migrator


    steps:

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}


      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      - name: Build Image
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE=ghcr.io/$OWNER/minicommerce-${{ matrix.image }}
          IMAGE_TAG=${{ github.event.workflow_run.head_sha }}

          docker build \
          -f ${{ matrix.service }}/Dockerfile \
          -t $IMAGE:latest \
          -t $IMAGE:$IMAGE_TAG .


      - name: Push Image
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE=ghcr.io/$OWNER/minicommerce-${{ matrix.image }}
          IMAGE_TAG=${{ github.event.workflow_run.head_sha }}

          docker push $IMAGE:latest
          docker push $IMAGE:$IMAGE_TAG
