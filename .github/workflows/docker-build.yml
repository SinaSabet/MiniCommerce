name: Docker Build and Push


on:
  push:
    branches:
      - main


permissions:
  contents: read
  packages: write


jobs:

  docker-build:

    runs-on: ubuntu-latest


    strategy:
      matrix:
        include:
          - service: Ordering.API
            image: ordering-api

          - service: Inventory.API
            image: inventory-api

          - service: Payment.API
            image: payment-api

          - service: Shipping.API
            image: shipping-api

          - service: FaultMonitoring.Worker
            image: fault-monitoring-worker


    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}


      - name: Build Docker Image
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/minicommerce-${{ matrix.image }}

          docker build \
          -f ${{ matrix.service }}/Dockerfile \
          -t $IMAGE:latest .


      - name: Push Docker Image
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/minicommerce-${{ matrix.image }}

          docker push $IMAGE:latest