name: Docker Build


on:
  push:
    branches:
      - main


jobs:

  docker-build:

    runs-on: ubuntu-latest


    strategy:
      matrix:
        service:
          - Ordering.API
          - Inventory.API
          - Payment.API
          - Shipping.API
          - FaultMonitoring.Worker


    steps:

      - name: Checkout
        uses: actions/checkout@v4


      - name: Build Docker Image
        run: |
          docker build \
          -f ${{ matrix.service }}/Dockerfile \
          -t minicommerce-${{ matrix.service }}:latest .