name: MiniCommerce CI


on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:

  build:


    runs-on: ubuntu-latest


    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x


      - name: Restore dependencies
        run: dotnet restore MiniCommerce.sln


      - name: Build solution
        run: dotnet build MiniCommerce.sln --no-restore --configuration Release


      - name: Run tests
        run: dotnet test MiniCommerce.sln --no-build --configuration Release