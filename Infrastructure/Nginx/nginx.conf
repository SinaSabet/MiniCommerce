events {}

http {
    log_format main '$remote_addr - $request_id [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" upstream=$upstream_addr '
                    'upstream_status=$upstream_status request_time=$request_time';

    access_log /var/log/nginx/access.log main;

    upstream ordering_api {
        server ordering-api:8080;
    }

    upstream inventory_api {
        server inventory-api:8080;
    }

    upstream payment_api {
        server payment-api:8080;
    }

    upstream shipping_api {
        server shipping-api:8080;
    }

    server {
        listen 80;
        server_name _;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;

        location /api/orders {
            proxy_pass http://ordering_api;
        }

        location /api/inventory {
            proxy_pass http://inventory_api;
        }

        location /api/payments {
            proxy_pass http://payment_api;
        }

        location /api/shipments {
            proxy_pass http://shipping_api;
        }

        location = /health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 'healthy\n';
        }
    }
}
